<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Foundry forges a brief or wireframe into a reviewable, deploy-ready landing page.">
  <title>Foundry</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app">
    <header class="bar">
      <a class="brand-lockup" href="#/" aria-label="Foundry home">
        <span class="logo" aria-hidden="true"><span>F</span><i></i></span>
        <span><span class="brand">Foundry</span><span class="brand-note">by Thesis</span></span>
      </a>
      <div class="bar-actions"><span class="status-pill"><i></i> Demo mode</span><button class="theme-toggle" id="theme-toggle" type="button" aria-label="Theme: system" title="Change theme"><span aria-hidden="true">◐</span><span class="theme-label">System</span></button></div>
    </header>
    <p class="tag" id="tagline">Where a spark becomes a shippable page.</p>
    <div class="shell" id="shell">
      <nav class="step-rail hidden" id="step-rail" aria-label="Build progress"></nav>
      <main id="stage" tabindex="-1"></main>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <template id="empty-template">
    <section class="surface empty-state"><h1>That route does not exist</h1><a class="btn btn--primary" href="#/">Return to the hub</a></section>
  </template>
  <template id="loading-template">
    <section class="surface"><h1 class="step-h">Building your page…</h1><ul class="steps" aria-label="Generation progress"></ul></section>
  </template>
  <script type="module" src="./src/render.js?v=resources-1"></script>
</body>
</html>
